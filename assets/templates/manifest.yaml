notes:
- Source filenames provide labels; result samples are not a complete outcome matrix.
- Progress crops are labeled by filename. The crop alone is not asserted to distinguish
  Day 3 victory from Day 3 without victory.
- Crop coordinates describe source screenshots and are normalized in addition to pixel
  coordinates.
- Normal Nightlord identity references come from preparation screens; Everdark references
  come from labeled result screens.
