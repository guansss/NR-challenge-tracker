name: Release Windows package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build requirements
        run: python -m pip install -r requirements-build.txt
      - name: Build portable release
        run: python tools/build_release.py
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Nightreign-Challenge-Tracker-v*-windows.zip
            dist/bilibili-*.user.js
