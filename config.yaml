schema_version: 1

paths:
  preparation_screens: assets/dataset/preparation-screens
  result_screens: assets/dataset/result-screens
  abnormal_result_screens: assets/dataset/result-screens-abnormal
  templates: assets/templates
  template_manifest: assets/templates/manifest.yaml
  contact_sheet: assets/templates/contact_sheet.png

recognition:
  source_dimensions: [2560, 1440]
  preparation_nightlord_roi: [0.051, 0.039, 0.042, 0.07]
  result_progress_roi: [0.692, 0.164, 0.263, 0.043]
  result_nightlord_search_roi: [0.10, 0.68, 0.11, 0.18]
  nightfarer_grid_x: [120, 259, 398, 536, 675]
  nightfarer_grid_y: [389, 529]
  selection_marker_in_tile: [2, 2, 44, 44]
  consecutive_confirmations: 3
  sampling:
    idle_ms: 1000
    preparation_ms: 200
    gameplay_ms: 1000
    result_ms: 200
  thresholds:
    template_score: 0.9
    result_template_score: 0.75
    identity_margin: 0.04
    variant_score_margin: 0.004
    progress_margin: 0.015
    victory_margin: 0.015

capture:
  target_window: "ELDEN RING NIGHTREIGN"

streak:
  target: 100
  eligible_nightfarer: "Executor"
  failure_rule: "all_nonvictories"
  cap_at_target: true

api:
  host: "127.0.0.1"
  port: 5678

bilibili:
  enabled: true
  room_id: null
  title_template: "Nightreign ({current_streak}/{target})"
  title_max_characters: 40
  polling_interval_seconds: 5

hud:
  enabled: true
  opacity: 0.10
  font_size: 14
  width: 420
  show_recent_sessions: true